<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מחשבון הבונוס של מאור המלך 👑</title>
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f5e28a;
      --bg-1: #0f1226;
      --bg-2: #1b2140;
      --card: rgba(255, 255, 255, 0.06);
      --text: #f4f4f8;
      --muted: #b9bdd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Assistant", "Rubik", Arial, sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(212,175,55,0.18), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(120,90,255,0.20), transparent 55%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
    }

    /* Floating "מאור המלך" background text */
    .crown-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      opacity: 0.06;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: 10px 26px;
      font-weight: 900;
      font-size: 26px;
      transform: rotate(-8deg) scale(1.2);
      user-select: none;
    }

    .wrap { position: relative; z-index: 1; width: 100%; max-width: 640px; }

    header { text-align: center; margin-bottom: 22px; }

    .crown { font-size: 46px; filter: drop-shadow(0 4px 10px rgba(212,175,55,0.5)); }

    h1 {
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 900;
      background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .subtitle { color: var(--muted); margin-top: 8px; font-size: 15px; }

    /* Stickers */
    .sticker-box {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 18px;
      margin: 18px 0 6px;
    }
    .sticker { display: flex; flex-direction: column; align-items: center; }
    .sticker img {
      width: 175px;
      max-width: 44vw;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45));
      animation: float 4s ease-in-out infinite;
    }
    .sticker:nth-child(2) img { animation-delay: 1.2s; }
    .sticker-name { margin-top: 6px; font-weight: 800; color: var(--gold-light); font-size: 14px; }
    .sticker-fallback {
      display: none;
      width: 175px; height: 200px;
      border: 2px dashed var(--gold);
      border-radius: 18px;
      align-items: center; justify-content: center;
      text-align: center; padding: 14px;
      color: var(--gold-light); font-weight: 700;
      background: rgba(212,175,55,0.08);
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 26px 22px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 15px; }
    label small { color: var(--muted); font-weight: 400; }

    input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      text-align: right;
    }
    input[type="number"]:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.25);
    }

    button {
      width: 100%;
      padding: 16px;
      font-size: 19px;
      font-weight: 900;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: #241c00;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      transition: transform .1s, box-shadow .15s;
      box-shadow: 0 10px 24px rgba(212,175,55,0.35);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(212,175,55,0.45); }
    button:active { transform: translateY(0); }

    .result {
      margin-top: 22px;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .3s, transform .3s;
    }
    .result.show { opacity: 1; transform: translateY(0); }
    .result .label { color: var(--muted); font-size: 15px; }
    .result .amount {
      font-size: clamp(36px, 10vw, 56px);
      font-weight: 900;
      margin-top: 4px;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .result .formula {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      direction: ltr;
      font-family: monospace;
    }
    .error { color: #ff8b8b; margin-top: 14px; text-align: center; font-weight: 700; min-height: 20px; }

    footer { text-align: center; color: var(--muted); margin-top: 26px; font-size: 13px; }
    footer b { color: var(--gold-light); }
  </style>
</head>
<body>
  <div class="crown-bg" id="crownBg"></div>

  <div class="wrap">
    <header>
      <div class="crown">👑</div>
      <h1>מחשבון הבונוס של מאור המלך</h1>
      <p class="subtitle">מאור המלך · מאור המלך · מאור המלך 👑</p>

      <div class="sticker-box">
        <div class="sticker">
          <img src="maor-sticker.png" alt="מאור המלך"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="sticker-fallback">
            הסטיקר של<br />מאור המלך 👑<br />
            <small style="font-weight:400">(קובץ: maor-sticker.png)</small>
          </div>
          <div class="sticker-name">מאור המלך 👑</div>
        </div>
        <div class="sticker">
          <img src="dog-sticker.png" alt="הכלב של מאור המלך"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="sticker-fallback">
            הסטיקר של<br />הכלב ❤️<br />
            <small style="font-weight:400">(קובץ: dog-sticker.png)</small>
          </div>
          <div class="sticker-name">הכלב של המלך ❤️</div>
        </div>
      </div>
    </header>

    <div class="card">
      <div class="field">
        <label for="standard">שעות תקן <small>(לדוגמא: 194)</small></label>
        <input type="number" id="standard" inputmode="decimal" placeholder="194" min="0" step="any" />
      </div>

      <div class="field">
        <label for="billing">שעות חיוב <small>(לדוגמא: 135)</small></label>
        <input type="number" id="billing" inputmode="decimal" placeholder="135" min="0" step="any" />
      </div>

      <button id="calcBtn">חשב את הבונוס של המלך 👑</button>

      <div class="error" id="error"></div>

      <div class="result" id="result">
        <div class="label">גובה הבונוס שלך:</div>
        <div class="amount" id="amount">₪0</div>
        <div class="formula" id="formula"></div>
      </div>
    </div>

    <footer>
      נבנה במיוחד עבור <b>מאור המלך</b> 👑 &nbsp;|&nbsp; ארוכים ימיו של המלך מאור
    </footer>
  </div>

  <script>
    // Fill the background with "מאור המלך" repeated (long live the king)
    (function () {
      const bg = document.getElementById('crownBg');
      const phrase = 'מאור המלך 👑';
      let html = '';
      for (let i = 0; i < 160; i++) html += '<span>' + phrase + '</span>';
      bg.innerHTML = html;
    })();

    const standardEl = document.getElementById('standard');
    const billingEl  = document.getElementById('billing');
    const errorEl    = document.getElementById('error');
    const resultEl   = document.getElementById('result');
    const amountEl   = document.getElementById('amount');
    const formulaEl  = document.getElementById('formula');

    function formatILS(n) {
      return new Intl.NumberFormat('he-IL', {
        style: 'currency', currency: 'ILS', maximumFractionDigits: 2
      }).format(n);
    }

    function calculate() {
      errorEl.textContent = '';
      const standard = parseFloat(standardEl.value); // שעות תקן
      const billing  = parseFloat(billingEl.value);  // שעות חיוב

      if (isNaN(standard) || isNaN(billing)) {
        errorEl.textContent = 'נא למלא את שני השדות 🙏';
        resultEl.classList.remove('show');
        return;
      }
      if (standard <= 0) {
        errorEl.textContent = 'שעות תקן חייבות להיות גדולות מ-0';
        resultEl.classList.remove('show');
        return;
      }

      // הנוסחה: (שעות חיוב / שעות תקן) / 0.75 * 3000
      const bonus = (billing / standard) / 0.75 * 3000;

      amountEl.textContent  = formatILS(bonus);
      formulaEl.textContent = '(' + billing + ' / ' + standard + ') / 0.75 × 3000 = ' + bonus.toFixed(2);
      resultEl.classList.add('show');
    }

    document.getElementById('calcBtn').addEventListener('click', calculate);
    [standardEl, billingEl].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); })
    );
  </script>
</body>
</html>
