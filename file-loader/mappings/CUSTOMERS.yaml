# ============================================================================
# מיפוי מאוחד — טעינת לקוחות/חשבונות אל ממשק הלקוחות של פריוריטי (CUSTOMERS)
# ----------------------------------------------------------------------------
# מיפוי אחד שמתאים למספר פורמטים של קבצי מקור (יצוא לקוחות רגיל, אינדקס חשבונות
# מחשבשבת) — לכל שדה אפשר להגדיר כמה "כינויים" (source כרשימה).
#
# ולידציית השדות (אורך מרבי, חובה, טיפוס, דיוק, בוליאני) נטענת אוטומטית מקטלוג
# השדות הרשמי של מסך הלקוחות ב-specs/CUSTOMERS.yaml — לכן אין צורך לחזור כאן על
# max_length/type/required עבור שדות תקניים. ערך מפורש כאן תמיד גובר על הקטלוג.
# ============================================================================

screen: CUSTOMERS
interface_name: XXXX_LOADCUST
delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: [CUSTNAME]

columns:
  # מס' לקוח — מזהה, נשמר כחובה (בקטלוג רוחב 16)
  - source: ["מספר לקוח", "מפתח חשבון", "קוד לקוח", "מספר חשבון"]
    target: CUSTNAME
    required: true
    transform: [strip, remove_spaces]

  # שם לקוח — חובה ורוחב 48 מגיעים מהקטלוג
  - source: ["שם לקוח", "שם חשבון", "שם"]
    target: CUSTDES
    transform: [strip]

  # סטטוס לקוח — שדה חובה (רוחב 12). ברירת מחדל "פעיל"
  - source: ["סטטוס", "חשבון פעיל", "פעיל"]
    target: STATDES
    default: "פעיל"
    transform: [strip]

  # תאריך פתיחה — טיפוס date מגיע מהקטלוג
  - source: ["תאריך פתיחה", "תאריך הקמה"]
    target: CREATEDDATE

  # טלפון — רוחב 20 מהקטלוג; רק ספרות; אזהרה אם לא תקין
  - source: ["טלפון", "טלפון קווי", "מס' טלפון"]
    target: PHONE
    transform: [strip]
    format: phone

  # פקס — רוחב 20 מהקטלוג
  - source: ["פקס"]
    target: FAX
    transform: [strip]
    format: phone

  # דואר אלקטרוני — רוחב 68 מהקטלוג; אזהרה אם לא תקין
  - source: ["דואר אלקטרוני", "אימייל", "מייל", 'דוא"ל', "email"]
    target: EMAIL
    transform: [strip, lower]
    format: email

  # כתובת — רוחב 80 מהקטלוג
  - source: ["כתובת", "רחוב"]
    target: ADDRESS
    transform: [strip]

  # כתובת שורה 2 — רוחב 80 מהקטלוג
  - source: ["כתובת - שורה 2", "כתובת 2"]
    target: ADDRESS2
    transform: [strip]

  # עיר — רוחב 40 מהקטלוג
  - source: ["עיר", "יישוב", "ישוב"]
    target: STATEA
    transform: [strip]

  # מיקוד — רוחב 10 מהקטלוג; אזהרה אם אינו 5/7 ספרות
  - source: ["מיקוד"]
    target: ZIP
    transform: [strip, digits_only]
    format: zip

  # מספר תיק במע"מ / עוסק — CHAR 16 (נשמר כטקסט); אזהרה אם ספרת הביקורת שגויה
  - source: ["מספר תיק במעמ", 'מספר תיק במע"מ', "מספר עוסק", "עוסק מורשה", "ח.פ.", "עוסק", "ע.מ."]
    target: VATNUM
    transform: [strip]
    format: idnum

  # משפחה / קוד מיון (חשבשבת) — שדה מותאם ללקוח (אינו שדה תקני במסך הלקוחות)
  - source: ["קוד מיון", "משפחה", "משפחת מוצר", "קבוצת מיון"]
    target: XXXX_FAMILY
    max_length: 20
    transform: [strip]
