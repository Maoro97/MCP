# ============================================================================
# מיפוי מאוחד — טעינת לקוחות/חשבונות אל ממשק הלקוחות של פריוריטי (CUSTOMERS)
# ----------------------------------------------------------------------------
# מיפוי אחד שמתאים למספר פורמטים של קבצי מקור (למשל יצוא לקוחות רגיל, או אינדקס
# חשבונות מחשבשבת) — לכל שדה אפשר להגדיר כמה "כינויים" (source כרשימה), והכלי
# בוחר אוטומטית את הכינוי שקיים בקובץ שהועלה. שדה שאין לו עמודה מתאימה בקובץ
# פשוט יישאר ריק (עם ברירת המחדל אם הוגדרה). שדות חובה שאין להם עמודה — יתריעו.
#
# ולידציות פורמט: format: phone / email — כברירת מחדל מפיקות *אזהרה* (לא פוסלות).
# להפוך אזהרה לפסילה: הוסף format_severity: error לאותה עמודה.
# ============================================================================

screen: CUSTOMERS
interface_name: XXXX_LOADCUST      # שם ה-Interface בפריוריטי (תיעוד בלבד)

delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: [CUSTNAME]             # מזהה הלקוח = מפתח ייחודי

columns:
  # מזהה הלקוח — חובה. מתאים ל"מספר לקוח" (יצוא רגיל) או "מפתח חשבון" (חשבשבת)
  - source: ["מספר לקוח", "מפתח חשבון", "קוד לקוח", "מספר חשבון"]
    target: CUSTNAME
    required: true
    max_length: 20
    transform: [strip, remove_spaces]

  # שם הלקוח — חובה
  - source: ["שם לקוח", "שם חשבון", "שם"]
    target: CUSTDES
    required: true
    max_length: 48
    transform: [strip]

  # כתובת
  - source: ["כתובת", "רחוב"]
    target: ADDRESS
    max_length: 48
    transform: [strip]

  # עיר / יישוב
  - source: ["עיר", "יישוב", "ישוב"]
    target: STATEA
    max_length: 24
    transform: [strip]

  # טלפון — רק ספרות; אזהרה אם המספר אינו תקין
  - source: ["טלפון", "טלפון קווי", "מס' טלפון"]
    target: PHONE
    max_length: 20
    transform: [strip]
    format: phone

  # טלפון נייד — רק ספרות; אזהרה אם אינו תקין
  - source: ["טלפון נייד", "נייד", "סלולרי", "פלאפון"]
    target: CELLPHONE
    max_length: 20
    transform: [strip]
    format: phone

  # דואר אלקטרוני — אזהרה אם הכתובת אינה תקינה
  - source: ["דואר אלקטרוני", "אימייל", "מייל", 'דוא"ל', "email"]
    target: EMAIL
    max_length: 50
    transform: [strip, lower]
    format: email

  # תאריך פתיחה (אם קיים בקובץ)
  - source: ["תאריך פתיחה", "תאריך הקמה"]
    target: XXXX_OPENDATE
    type: date

  # מספר עוסק / ח.פ. (אם קיים)
  - source: ["מספר עוסק", "עוסק מורשה", "ח.פ.", "עוסק", "ע.מ."]
    target: CUSTAX
    type: number
    max_length: 9

  # חייב מע"מ — מיפוי לערכי פריוריטי, ברירת מחדל Y
  - source: ["חייב מעמ", 'חייב מע"מ']
    target: VATFLAG
    value_map: {"כן": "Y", "לא": "N"}
    default: "Y"

  # פעיל/לא פעיל — מיפוי לדגל, ברירת מחדל Y
  - source: ["חשבון פעיל", "פעיל", "סטטוס"]
    target: XXXX_ACTIVE
    value_map: {"פעיל": "Y", "לא פעיל": "N", "לא": "N"}
    default: "Y"

  # משפחת מוצר/לקוח — בחשבשבת מיוצגת ע"י "קוד מיון" (הקוד, למשל 349).
  # "שם קוד מיון" הוא התיאור של המשפחה (למשל "לקוחות ציוד רפואי").
  # אם ה-Interface מצפה לשם המשפחה במקום לקוד — החלף את הכינוי הראשון ב"שם קוד מיון".
  - source: ["קוד מיון", "משפחה", "משפחת מוצר", "קבוצת מיון"]
    target: FAMILYNAME
    max_length: 20
    transform: [strip]
