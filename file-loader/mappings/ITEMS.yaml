# ============================================================================
# מיפוי — טעינת פריטים אל מסך כרטיס פריט בפריוריטי (PART)
# ולידציית השדות (אורך, חובה, טיפוס, דיוק, בוליאני) נטענת אוטומטית
# מ-specs/PART.yaml (קטלוג השדות הרשמי). ערך מפורש כאן גובר על הקטלוג.
# ============================================================================

screen: PART
interface_name: XXXX_LOADPART
delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: [PARTNAME]

columns:
  # מק"ט — מזהה, חובה (רוחב 22)
  - source: ["מקט", 'מק"ט', "מק'ט", "קוד פריט"]
    target: PARTNAME
    transform: [strip, remove_spaces]

  # תאור מוצר — חובה (רוחב 59)
  - source: ["תאור פריט", "תאור מוצר", "תיאור", "שם פריט"]
    target: PARTDES
    transform: [strip]

  # סטטוס — חובה (רוחב 12), ברירת מחדל "פעיל"
  - source: ["סטטוס", "פעיל"]
    target: STATDES
    default: "פעיל"
    transform: [strip]

  # טיפוס P/R/O — חובה (רוחב 1). P=נקנה, R=מיוצר, O=אחר. ברירת מחדל P
  - source: ["טיפוס", "סוג פריט"]
    target: TYPE
    value_map: {"קניה": "P", "נקנה": "P", "רכש": "P", "ייצור": "R", "מיוצר": "R", "אחר": "O",
                "P": "P", "R": "R", "O": "O"}
    default: "P"

  # יחידת מידה — חובה (רוחב 3)
  - source: ["יחידת מידה", "יחידה", 'יח"מ']
    target: UNITNAME
    value_map: {"יחידה": "יח'", "יח'": "יח'", "קג": "ק\"ג", 'ק"ג': "ק\"ג", "מטר": "מ'", "ליטר": "ל'"}
    default: "יח'"

  # יח' מפעל — חובה (רוחב 3), כברירת מחדל זהה ליחידת המידה
  - source: ["יח' מפעל", "יחידת מפעל"]
    target: PUNITNAME
    default: "יח'"

  # שעור המרת יחידות — חובה (מספר), ברירת מחדל 1
  - source: ["שעור המרה", "המרת יחידות"]
    target: CONV
    default: "1"

  # משפחת מוצר — חובה (רוחב 8)
  - source: ["משפחה", "קוד משפחה", "קבוצה", "קבוצת מוצר"]
    target: FAMILYNAME
    transform: [strip]

  # ברקוד — רוחב 22, ספרות בלבד
  - source: ["ברקוד", "barcode"]
    target: BARCODE
    transform: [digits_only]

  # מחיר קניה — מספר עם 2 ספרות (מהקטלוג)
  - source: ["מחיר", "מחיר קניה", "עלות"]
    target: PURPRICE
