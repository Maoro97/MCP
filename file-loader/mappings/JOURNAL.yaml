# ============================================================================
# מיפוי — הסבת תנועות יומן ל"טעינת תנועות יומן" בפריוריטי (מסך JOURNAL / LOADGL)
# ----------------------------------------------------------------------------
# שמות ה-target תואמים לשמות השדות הרשמיים של מסך היומן בפריוריטי (עמודת המסך),
# וסדר העמודות כאן = סדר הפלט, לפי הסדר בקטלוג השדות הרשמי.
# ולידציית השדות (אורך, חובה, טיפוס, דיוק עשרוני) נטענת אוטומטית מ-
# specs/JOURNAL.yaml (קטלוג השדות הרשמי). ערך מפורש כאן גובר על הקטלוג.
#
# כללי ההסבה החשבונאיים (איזון תנועות, סימני C/D, המרות מט"ח) מיושמים במנוע
# הייעודי (journal.py) דרך הגדרת ה-journal למטה.
# ============================================================================

screen: JOURNAL
interface_name: XXXX_LOADGL
delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: []           # קיבוץ התנועה לאיזון: לפי FNCNUM (מס' תנועת היומן)

# הגדרות ההסבה (מנוע האיזון/המט"ח)
journal:
  txn: FNCNUM               # מספר תנועת יומן — קיבוץ לאיזון
  dc: DEBIT                 # עמודת חובה/זכות (C/D)
  amount_primary: SUM1      # סכום במטבע מקומי (ראשי)
  amount_secondary: SUM2    # סכום במטבע בסיס/משני ({FC.F}, למשל USD)
  amount_fx: SUM5           # סכום במטבע העסקה (מט"ח עסקה)
  currency_fx: CODE5        # קוד מטבע העסקה
  date_balance: BALDATE     # בדיקה: תאריך מאזן אחד לכל התנועה
  date_ref: CURDATE         # בדיקה: תאריך אסמכתא אחד לכל התנועה
  # איחוד חובה/זכות: אם הסכום מגיע בשתי עמודות נפרדות -> עמודת סכום אחת + C/D
  debit_source:  ['חובה/זכות(שקל) חובה', "סכום חובה", "חובה", "debit"]
  credit_source: ['חובה/זכות(שקל) זכות', "סכום זכות", "זכות", "credit"]
  fx_debit_source:  ['חובה/זכות(מט"ח) חובה']
  fx_credit_source: ['חובה/זכות(מט"ח) זכות']
  # אם הסכום מגיע בעמודה אחת עם סימן: שלילי=C, חיובי=D, והסכום בערך מוחלט
  signed_source: ["סכום עם סימן", "סכום מסומן"]
  # סוג תנועה לפי הסכום הראשי: 0 -> הש, אחרת -> מ
  transtype: FNCPATNAME
  transtype_zero: "הש"
  transtype_nonzero: "מ"
  # מס' החשבון בכרטסת מופיע בעמודה B בשורת כותרת-המקטע בלבד — יועבר לכל שורות
  # התנועה שמתחתיו (רלוונטי רק כשמזוהה מבנה כרטסת; אחרת לא משפיע).
  account_ffill: "B"

# שורות לא-רלוונטיות (כותרות חשבון/יתרות בכרטסת) חסרות מספר תנועה — יסוננו
require_source: [FNCNUM]

# שורה שכל שלושת הסכומים בה 0/ריק — לא תיטען לקובץ (מסומנת בבדיקת התנועות)
exclude_if_all_zero: [SUM1, SUM2, SUM5]

columns:
  # מס' תנועת היומן = מספר הכותרת (מאגד את שורות התנועה). "תנועה" בכרטסת הוא מספר
  # השורה/התזוזה — ולכן הקיבוץ לאיזון הוא לפי "כותרת", לא לפי "תנועה".
  - {source: ["מס. תנועת היומן", "מס תנועת היומן", "מספר תנועת יומן", "כותרת"], target: FNCNUM, transform: [strip]}
  - {target: LINE, generate: rownum}                                   # מספור שורות רץ אוטומטי
  # סוג תנועה — נגזר אוטומטית מהסכום (הש/מ), אך אם קיים במקור נטען ממנו
  - {source: ["סוג תנועה"], target: FNCPATNAME, transform: [strip]}
  - {source: ["אסמכתא", "אסמ'", "אסמ"], target: IVNUM, transform: [strip, blank_if_zero], format: ref}
  - {source: ["אסמכתא 2", "אסמ'2", "אסמ2"], target: FNCREF2, transform: [strip, blank_if_zero]}
  - {source: ["ת. למאזן", "תאריך מאזן"], target: BALDATE, type: date}
  - {source: ["ת. אסמכתא", "תאריך אסמכתא", "ת.אסמ", "ת.אסמכתא"], target: CURDATE, type: date}
  - {source: ["ת. ערך", "תאריך ערך", "ת.ערך"], target: FNCDATE, type: date}
  - {source: ["__ACCOUNT__", "חשבון", "מפתח חשבון", "ח-ן נגדי", "חשבון נגדי"], target: ACCNAME, transform: [strip]}
  - {source: ["קוד מרכז רווח", "מרכז רווח", "מרכז רווח 1"], target: COSTCNAME, max_length: 16, transform: [strip]}
  - {source: ["מרכז רווח 2", "קוד מרכז רווח 2"], target: COSTCNAME2, max_length: 16, transform: [strip]}
  - {source: ["מרכז רווח 3", "קוד מרכז רווח 3"], target: COSTCNAME3, max_length: 16, transform: [strip]}
  - {source: ["מרכז רווח 4", "קוד מרכז רווח 4"], target: COSTCNAME4, max_length: 16, transform: [strip]}
  - {source: ["מרכז רווח 5", "קוד מרכז רווח 5"], target: COSTCNAME5, max_length: 16, transform: [strip]}
  - {source: ["סניף"], target: BRANCHNAME, max_length: 6, transform: [strip]}
  - {source: ["פרויקט", "פרוייקט"], target: DOCNO, max_length: 20, transform: [strip]}
  - {source: ["תקציב", "קוד תקציב"], target: BUDCODE, max_length: 30, transform: [strip]}
  # C/D — נגזר מעמודות חובה/זכות (__DC__), או ממקור ישיר אם קיים
  - {source: ["__DC__", "חובה/זכות", "חובה זכות", "C/D"], target: DEBIT, transform: [strip]}
  # סכום ראשי — עמודת האיחוד (__AMOUNT_PRIMARY__) אם הגיע מחובה/זכות, אחרת ממקור ישיר
  - {source: ["__AMOUNT_PRIMARY__", "סכום במטבע לוקאלי", "סכום במטבע לוקאל", "סכום מטבע ראשי"], target: SUM1, transform: [strip]}
  - {source: ["סכום במטבע משני USD", "סכום במטבע משני", "סכום דולרי"], target: SUM2, transform: [strip]}
  - {source: ["תוכנת מקור"], target: DNAME, default: "", transform: [strip]}
  - {source: ['אסמכתא 1 שורת ת"י', "אסמכתא 1 שורת תי"], target: FNCIREF1, transform: [strip]}
  - {source: ['אסמכתא 2 שורת ת"י', "אסמכתא 2 שורת תי"], target: FNCIREF2, transform: [strip]}
  - {source: ['פרטים שורת ת"י', "פרטים שורת תי", "פרטים"], target: DETAILS, max_length: 24, transform: [strip]}
  - {source: ["הערה", "הערות שורה"], target: TEXT, max_length: 32, transform: [strip]}
  - {source: ["__AMOUNT_FX__", "סכום במטבע העסקה", "סכום מטח עסקה"], target: SUM5, transform: [strip]}
  - {source: ["מטבע העסקה", "מטח עסקה", "מט"], target: CODE5, transform: [strip],
     value_map: {"$": "USD", "€": "EUR", "£": "GBP", "₪": "ILS"}, lookup: currencies}
  - {source: ["משתמש", "שם משתמש"], target: USERLOGIN, transform: [strip]}
  # עמודת הערות למיישם — מוצגת בטבלה אך אינה נכתבת לקובץ הסופי
  - {target: NOTES, manual: true, exclude: true}
