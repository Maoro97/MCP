# ============================================================================
# מיפוי — הסבת תנועות יומן אל "טבלת טעינה לתנועות יומן" בפריוריטי  (שלד ראשוני)
# ----------------------------------------------------------------------------
# זהו שלד עבודה שמדגים את יכולות המנוע הנדרשות להסבת תנועות יומן. חלק מהשדות
# והכללים (סימני C/D, איזון תנועות, המרות מט"ח, קודי מטבע) יושלמו לאחר שתאושר
# הגדרת השדות המדויקת של המסך וכללי ההסבה. התאם את שמות ה-target לשמות השדות
# בהגדרת ה-Interface שלך בפריוריטי.
#
# יכולות שממומשות כבר כאן:
#   generate: rownum   — מספור שורות רץ אוטומטי
#   manual: true       — עמודה שהמיישם מקליד בטבלה (לא מגיעה מהקובץ)
#   exclude: true      — עמודה שמוצגת בטבלה אך *אינה* נכתבת לקובץ הסופי
#   transform: [blank_if_zero]  — אסמכתא 0 -> ריק
#   transform: [abs]            — ערך מוחלט (חיובי תמיד)
#   format: ref        — אזהרה על אסמכתא בת תו אחד (לבדיקה)
#   type: date         — תאריך בפורמט פריוריטי (dd/mm/yy)
# ============================================================================

screen: JOURNAL
interface_name: XXXX_LOADGL
delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: []            # קיבוץ התנועה לאיזון ייקבע לפי הגדרת המשתמש (אסמכתא/מספר תנועה)

columns:
  # מספר שורה רץ — אוטומטי
  - target: LINE
    generate: rownum

  # תוכנת מקור — ערך קבוע שהמיישם מגדיר (עדכן את ה-default)
  - target: XXXX_SOURCEAPP
    default: "חשבשבת"

  # אסמכתא — 0 הופך לריק; תו בודד מסומן לבדיקה
  - source: ["אסמכתא", "אסמכתא 1", "מספר אסמכתא"]
    target: REFERENCE
    transform: [strip, blank_if_zero]
    format: ref

  # תאריך התנועה — פורמט פריוריטי
  - source: ["תאריך", "תאריך תנועה", "ת. ערך"]
    target: TRANSDATE
    type: date

  # פרטים/תיאור
  - source: ["פרטים", "תיאור", "פרוט"]
    target: DETAILS
    transform: [strip]

  # הערות למיישם — עמודה ידנית, מוצגת בטבלה אך *לא* נכתבת לקובץ הסופי
  - target: NOTES
    manual: true
    exclude: true
