# ============================================================================
# מיפוי — הסבת תנועות יומן ל"טעינת תנועות יומן" בפריוריטי (מסך JOURNAL / LOADGL)
# ----------------------------------------------------------------------------
# שמות ה-target תואמים לשמות השדות הרשמיים של מסך היומן בפריוריטי (עמודת המסך),
# וסדר העמודות כאן = סדר הפלט, לפי הסדר בקטלוג השדות הרשמי.
# ולידציית השדות (אורך, חובה, טיפוס, דיוק עשרוני) נטענת אוטומטית מ-
# specs/JOURNAL.yaml (קטלוג השדות הרשמי). ערך מפורש כאן גובר על הקטלוג.
#
# כללי ההסבה החשבונאיים (איזון תנועות, סימני C/D, המרות מט"ח) מיושמים במנוע
# הייעודי (journal.py) דרך הגדרת ה-journal למטה.
# ============================================================================

screen: JOURNAL
interface_name: XXXX_LOADGL
delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: []           # קיבוץ התנועה לאיזון: לפי FNCNUM (מס' תנועת היומן)

# הגדרות ההסבה (מנוע האיזון/המט"ח)
journal:
  txn: FNCNUM               # מספר תנועת יומן — קיבוץ לאיזון
  dc: DEBIT                 # עמודת חובה/זכות (C/D)
  amount_primary: SUM1      # סכום במטבע מקומי (ראשי)
  amount_secondary: SUM2    # סכום במטבע בסיס/משני ({FC.F}, למשל USD)
  amount_fx: SUM5           # סכום במטבע העסקה (מט"ח עסקה)
  currency_fx: CODE5        # קוד מטבע העסקה
  date_balance: BALDATE     # בדיקה: תאריך מאזן אחד לכל התנועה
  date_ref: CURDATE         # בדיקה: תאריך אסמכתא אחד לכל התנועה

# שורה שכל שלושת הסכומים בה 0/ריק — לא תיטען לקובץ (מסומנת בבדיקת התנועות)
exclude_if_all_zero: [SUM1, SUM2, SUM5]

columns:
  - {source: ["מס. תנועת היומן", "מס תנועת היומן", "מספר תנועת יומן"], target: FNCNUM, transform: [strip]}
  - {target: LINE, generate: rownum}                                   # מספור שורות רץ אוטומטי
  - {source: ["סוג תנועה"], target: FNCPATNAME, transform: [strip]}
  - {source: ["אסמכתא"], target: IVNUM, transform: [strip, blank_if_zero], format: ref}
  - {source: ["אסמכתא 2"], target: FNCREF2, transform: [strip, blank_if_zero]}
  - {source: ["ת. למאזן", "תאריך מאזן"], target: BALDATE, type: date}
  - {source: ["ת. אסמכתא", "תאריך אסמכתא"], target: CURDATE, type: date}
  - {source: ["ת. ערך", "תאריך ערך"], target: FNCDATE, type: date}
  - {source: ["חשבון", "מפתח חשבון"], target: ACCNAME, transform: [strip]}
  - {source: ["קוד מרכז רווח", "מרכז רווח"], target: COSTCNAME, transform: [strip]}
  - {source: ["חובה/זכות", "חובה זכות", "C/D"], target: DEBIT, transform: [strip]}
  - {source: ["סכום במטבע לוקאלי", "סכום במטבע לוקאל", "סכום מטבע ראשי"], target: SUM1, transform: [strip]}
  - {source: ["סכום במטבע משני USD", "סכום במטבע משני", "סכום דולרי"], target: SUM2, transform: [strip]}
  - {source: ["תוכנת מקור"], target: DNAME, default: "", transform: [strip]}
  - {source: ['אסמכתא 1 שורת ת"י', "אסמכתא 1 שורת תי"], target: FNCIREF1, transform: [strip]}
  - {source: ['אסמכתא 2 שורת ת"י', "אסמכתא 2 שורת תי"], target: FNCIREF2, transform: [strip]}
  - {source: ['פרטים שורת ת"י', "פרטים שורת תי", "פרטים"], target: DETAILS, transform: [strip]}
  - {source: ["סכום במטבע העסקה", "סכום מטח עסקה"], target: SUM5, transform: [strip]}
  - {source: ["מטבע העסקה", "מטח עסקה"], target: CODE5, transform: [strip], lookup: currencies}
  - {source: ["משתמש", "שם משתמש"], target: USERLOGIN, transform: [strip]}
  # עמודת הערות למיישם — מוצגת בטבלה אך אינה נכתבת לקובץ הסופי
  - {target: NOTES, manual: true, exclude: true}
