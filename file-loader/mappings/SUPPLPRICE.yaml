# ============================================================================
# מיפוי — מחירוני ספקים (מסך אב) + מחירי מוצרים (מסך בן) → קובץ טעינה רב-רמתי
# ----------------------------------------------------------------------------
# קלט: אקסל שטוח שבו כל שורה = שורת מחיר למוצר, ועמודות המחירון (אב) חוזרות בכל
# שורה. הקיבוץ לאב הוא לפי (קוד מחירון ספק + מס' ספק).
#
# פלט (leveled): קובץ טקסט אחד שבו העמודה הראשונה היא מזהה הרמה — 1 = אב, 2 = בן.
#
# הגדרות השדות (שם עברי, אורך, טיפוס, חובה) נלקחו מקטלוג השדות של הלקוח.
# שדות חובה (M): אב — SUPNAME (מס' ספק), CODE (מטבע) · בן — PARTNAME (מק"ט), CODE.
# ============================================================================

screen: SUPPLPRICE
document: true
leveled: true
interface_name: XXXX_LOADSUPPRICE
delimiter: tab
encoding: windows-1255
date_format: "%d/%m/%y"
include_header: false
key_fields: [SUPPLNAME, SUPNAME]

# --- עמודות האב (מחירון ספק) — רמה 1 ---
columns:
  - source: ["קוד מחירון ספק", "קוד מחירון", "מספר מחירון", "מחירון", "מזהה מחירון"]
    target: SUPPLNAME
    title: "קוד מחירון ספק"
    max_length: 8
    transform: [strip]
  - source: ["מס' ספק", "מספר ספק", "קוד ספק", "ספק", "מס ספק"]
    target: SUPNAME
    title: "מס' ספק"
    required: true
    max_length: 16
    transform: [strip]
  - source: ["תאור מחירון ספק", "תיאור מחירון", "תאור מחירון", "שם מחירון"]
    target: SUPPLDES
    title: "תאור מחירון ספק"
    max_length: 16
    transform: [strip]
  - source: ["ת. כניסה לתוקף", "תאריך כניסה לתוקף", "תאריך מחירון", "תאריך תוקף", "מתאריך"]
    target: SUPPLDATE
    title: "ת. כניסה לתוקף"
    type: date
    transform: [strip]
  - source: ["ת. סיום תוקף", "תאריך סיום תוקף", "תקף עד", "עד תאריך", "תאריך סיום"]
    target: EXPIRYDATE
    title: "ת. סיום תוקף"
    type: date
    transform: [strip]
  - source: ["מטבע", "קוד מטבע"]
    target: CODE
    title: "מטבע"
    required: true
    max_length: 3
    value_map: {"שקל": "ILS", 'ש"ח': "ILS", "שח": "ILS", "דולר": "USD", "אירו": "EUR", "יורו": "EUR"}
    default: "ILS"
    lookup: currencies

# --- מסך-משנה: מחירי מוצרים — רמה 2 ---
subforms:
  - name: PRICES
    interface_name: XXXX_LOADSUPPRICE_LINES
    columns:
      - source: ["מקט", 'מק"ט', "קוד פריט", "מספר פריט", "פריט"]
        target: PARTNAME
        title: 'מק"ט'
        required: true
        max_length: 22
        transform: [strip, remove_spaces]
      - source: ['מק"ט ספק', "מקט ספק", "מספר פריט ספק", "מקט הספק", "פריט ספק"]
        target: SUPPARTNAME
        title: 'מק"ט ספק'
        max_length: 30
        transform: [strip]
      - source: ["כמות", "כמות מדרגה", "כמות מינימלית", "מכמות"]
        target: QUANT
        title: "כמות"
        type: number
        transform: [strip]
      - source: ["מחיר", "מחיר יחידה", "מחיר ליחידה"]
        target: PRICE
        title: "מחיר"
        type: number
        decimals: 2
        transform: [strip]
      - source: ["הנחה (%)", "אחוז הנחה", "הנחה", "% הנחה", "אחוז מרווח"]
        target: PERCENT
        title: "הנחה (%)"
        type: number
        decimals: 2
        transform: [strip]
      - source: ["מטבע", "קוד מטבע"]
        target: CODE
        title: "מטבע"
        required: true
        max_length: 3
        value_map: {"שקל": "ILS", 'ש"ח': "ILS", "שח": "ILS", "דולר": "USD", "אירו": "EUR", "יורו": "EUR"}
        default: "ILS"
        lookup: currencies
