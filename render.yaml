# ============================================================================
# Render Blueprint — פריסת "ממשק הכנת קבצי טעינה לפריוריטי" בענן.
# ----------------------------------------------------------------------------
# פריסה בלחיצה: היכנס ל-https://dashboard.render.com/blueprints, חבר את מאגר
# הגיטהאב Maoro97/MCP, ו-Render יקרא קובץ זה ויפרוס אוטומטית.
# התוכנית free חינמית לחלוטין (ללא כרטיס אשראי). כתובת ציבורית (https) תתקבל בסיום.
# ============================================================================
services:
  - type: web
    name: priority-file-loader
    runtime: python
    plan: free
    rootDir: file-loader          # שורש הפרויקט לפריסה — תיקיית הכלי בלבד
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    # worker יחיד: מצב-הריצה (RUNS) נשמר בזיכרון התהליך, ולכן ריבוי workers היה
    # מפצל אותו. threads מאפשרים כמה משתמשים במקביל על אותו worker.
    autoDeploy: true              # פריסה מחדש אוטומטית בכל דחיפה לענף המחובר
    healthCheckPath: /
    envVars:
      # --- כלי הכנת קבצי הטעינה ---
      - key: SECRET_KEY           # חתימת ה-session (בלעדיו התחברות לא שורדת deploy)
        generateValue: true
      - key: APP_PASSWORD         # סיסמת הכניסה לכלי הכנת הקבצים
        sync: false
      # --- ממשק קליטת הספקים (/intake) ---
      # בלי משתמש מנהל הממשק חוסם את עצמו — זו התנהגות מכוונת.
      - key: INTAKE_SECRET        # הצפנת הטוקן של פריוריטי במסד
        generateValue: true
      - key: INTAKE_ADMIN_USER    # שם המנהל הראשון של ממשק הקליטה
        sync: false
      - key: INTAKE_ADMIN_PASSWORD
        sync: false
      - key: INTAKE_ADMIN_PHONE   # טלפון לקבלת קודי האימות
        sync: false
      # אפשר להזין את פרטי החיבור כאן במקום במסך ההגדרות:
      # - key: INTAKE_PRIORITY_URL
      #   sync: false
      # - key: INTAKE_PRIORITY_TOKEN
      #   sync: false
